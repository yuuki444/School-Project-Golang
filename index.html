<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>своя School</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #c8e6c9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 28px;
        }

        header p {
            color: #666;
            margin-top: 0;
        }

        section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        h2 {
            font-size: 18px;
            color: var(--primary-hover);
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group.full {
            grid-template-columns: 1fr;
        }

        input {
            font-family: inherit;
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            font-family: inherit;
            flex: 1;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.secondary {
            background: #e8f5e9;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        button.secondary:hover {
            background: #c8e6c9;
        }

        pre {
            background: #f8f9fa;
            color: #212529;
            padding: 12px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            max-height: 250px;
        }

        .token-box {
            font-weight: bold;
            color: var(--primary-hover);
            word-break: break-all;
            background: #e8f5e9;
            padding: 8px;
            border-radius: 4px;
            border: 1px dashed var(--primary-color);
            margin-top: 5px;
        }
        
        .output-section {
            border-left: 5px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>School</h1>
        <p>Электронный дневник — Уроки 1 & 2</p>
    </header>

    <section>
        <h2>1. Авторизация</h2>
        <div class="form-group full">
            <input type="email" id="regEmail" placeholder="Email (например, teacher@school.ru)">
            <input type="password" id="regPass" placeholder="Пароль">
        </div>
        <div class="btn-container">
            <button class="secondary" onclick="register()">Регистрация</button>
            <button onclick="login()">Войти</button>
        </div>
        <p style="margin: 10px 0 2px 0; font-size: 13px; color: #666;">Текущий токен:</p>
        <div id="tokenDisplay" class="token-box">нет токена</div>
    </section>

    <section>
        <h2>2. Управление учениками</h2>
        <div class="form-group">
            <input type="text" id="studName" placeholder="ФИО ученика">
            <input type="text" id="studClass" placeholder="Класс (например, 11Б)">
        </div>
        <div class="form-group">
            <input type="number" id="studAge" placeholder="Возраст">
            <input type="email" id="studEmail" placeholder="Email ученика">
        </div>
        <div class="btn-container">
            <button onclick="createStudent()">Создать ученика</button>
            <button class="secondary" onclick="getStudents()">Получить список</button>
        </div>
    </section>

    <section class="output-section">
        <h2>Ответ сервера</h2>
        <pre id="output">Здесь появится результат запроса...</pre>
    </section>

<script>
let token = "";

async function request(url, method = 'GET', data = null) {
    let headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = token;
    
    let options = { method, headers };
    if (data) options.body = JSON.stringify(data);

    try {
        let res = await fetch(url, options);
        let json = await res.json();
        document.getElementById('output').innerText = JSON.stringify(json, null, 2);
        return json;
    } catch(e) {
        document.getElementById('output').innerText = "Ошибка: " + e.message;
    }
}

async function register() {
    let email = document.getElementById('regEmail').value;
    let password = document.getElementById('regPass').value;
    await request('/auth/register', 'POST', { email, password });
}

async function login() {
    let email = document.getElementById('regEmail').value;
    let password = document.getElementById('regPass').value;
    let res = await request('/auth/login', 'POST', { email, password });
    if (res && res.token) {
        token = res.token;
        document.getElementById('tokenDisplay').innerText = token;
    }
}

async function createStudent() {
    let full_name = document.getElementById('studName').value;
    let student_class = document.getElementById('studClass').value;
    let age = parseInt(document.getElementById('studAge').value) || 0;
    let email = document.getElementById('studEmail').value;
    await request('/students', 'POST', { full_name, class: student_class, age, email });
}

async function getStudents() {
    await request('/students', 'GET');
}
</script>
</body>
</html>
